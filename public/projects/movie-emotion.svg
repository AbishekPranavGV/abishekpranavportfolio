<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_movie-emotion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d29" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_movie-emotion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_movie-emotion" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_movie-emotion)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Emotion-Aware Movie Recommender</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#a855f7" />
  <text x="474" y="22" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Emotion-Aware Movie Recommender</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Affective NLP computing mapping sentiment vectors to cinema corpus</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#291542" stroke="#4a2575" />
          <text x="14" y="24" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="800">7 Classes</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Affective Sentiment</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#291542" stroke="#4a2575" />
          <text x="194" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">45,000+</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Film Plot Corpus</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#291542" stroke="#4a2575" />
          <text x="374" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">Streamlit</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Interactive Frontend</text>
        </g>

        <!-- Emotion Radar &amp; Movie Cards -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#201036" stroke="#4a2575" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Sentiment Emotion Vector &amp; Dynamic Watchlist Recommendations</text>
          
          <rect x="25" y="38" width="150" height="88" rx="6" fill="#311952" stroke="#a855f7" />
          <text x="35" y="58" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="700">Inspirational / Awe</text>
          <text x="35" y="74" fill="#d8b4fe" font-family="sans-serif" font-size="9">Score: 94.2% Similarity</text>
          <text x="35" y="94" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">Top Match: Interstellar</text>
          <text x="35" y="108" fill="#94a3b8" font-family="sans-serif" font-size="8">Director: Nolan · Rating: 8.7</text>

          <rect x="195" y="38" width="150" height="88" rx="6" fill="#311952" stroke="#a855f7" />
          <text x="205" y="58" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="700">Suspense / Tension</text>
          <text x="205" y="74" fill="#d8b4fe" font-family="sans-serif" font-size="9">Score: 89.1% Similarity</text>
          <text x="205" y="94" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">Top Match: Shutter Island</text>
          <text x="205" y="108" fill="#94a3b8" font-family="sans-serif" font-size="8">Mystery Thriller · Rating: 8.2</text>

          <rect x="365" y="38" width="150" height="88" rx="6" fill="#311952" stroke="#a855f7" />
          <text x="375" y="58" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="700">Joy / Uplifting</text>
          <text x="375" y="74" fill="#d8b4fe" font-family="sans-serif" font-size="9">Score: 91.5% Similarity</text>
          <text x="375" y="94" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">Top Match: Walter Mitty</text>
          <text x="375" y="108" fill="#94a3b8" font-family="sans-serif" font-size="8">Adventure Comedy · Rating: 7.8</text>
        </g>
        
  </g>
</svg>