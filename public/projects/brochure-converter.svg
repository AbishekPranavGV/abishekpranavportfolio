<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_brochure-converter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c08" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_brochure-converter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_brochure-converter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_brochure-converter)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Smart Brochure to Catalog Converter</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#84cc16" fill-opacity="0.18" stroke="#84cc16" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#84cc16" />
  <text x="474" y="22" fill="#84cc16" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Smart Brochure to Catalog Converter</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">IDP OCR multi-column brochure table extraction to structured data</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#20330e" stroke="#375919" />
          <text x="14" y="24" fill="#84cc16" font-family="sans-serif" font-size="18" font-weight="800">98% Accuracy</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Table OCR Parsing</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#20330e" stroke="#375919" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">Instant</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">JSON / Excel Export</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#20330e" stroke="#375919" />
          <text x="374" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">Multi-Column</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Complex Layout Parser</text>
        </g>

        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#17260b" stroke="#375919" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">PDF Document Layout Segmentation & Table Extraction</text>
          
          <rect x="25" y="40" width="230" height="88" rx="6" fill="#0d1406" stroke="#253d11" />
          <text x="35" y="58" fill="#84cc16" font-family="sans-serif" font-size="10" font-weight="700">INPUT PDF BROCHURE</text>
          <text x="35" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="8">Multi-column irregular PDF</text>
          <text x="35" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="8">Unstructured spec blocks</text>
          <text x="35" y="108" fill="#eab308" font-family="sans-serif" font-size="8">OCR Segmenting Tables...</text>

          <line x1="265" y1="84" x2="295" y2="84" stroke="#84cc16" stroke-width="2" />

          <rect x="305" y="40" width="210" height="88" rx="6" fill="#0d1406" stroke="#10b981" />
          <text x="315" y="58" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">STRUCTURED CATALOG</text>
          <text x="315" y="76" fill="#a7f3d0" font-family="monospace" font-size="8">✓ 320 SKUs Normalized</text>
          <text x="315" y="92" fill="#a7f3d0" font-family="monospace" font-size="8">✓ Voltage & RPM Extracted</text>
          <text x="315" y="108" fill="#a7f3d0" font-family="monospace" font-size="8">✓ Exported to Excel / JSON</text>
        </g>
        
  </g>
</svg>