<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_covid-forecasting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0d1a" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_covid-forecasting" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_covid-forecasting" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_covid-forecasting)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">COVID-19 Global Forecasting Model</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#ec4899" />
  <text x="474" y="22" fill="#ec4899" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">COVID-19 Global Forecasting Model</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">SEIR compartmental curves &amp; trajectory transmission modeling</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#36152d" stroke="#5c244e" />
          <text x="14" y="24" fill="#ec4899" font-family="sans-serif" font-size="18" font-weight="800">91.2%</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Model Accuracy</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#36152d" stroke="#5c244e" />
          <text x="194" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">180+ Nations</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Time-Series Modeled</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#36152d" stroke="#5c244e" />
          <text x="374" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">SEIR Fit</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Differential Inflection</text>
        </g>

        <!-- SEIR Trajectory Curves -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#280f21" stroke="#5c244e" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Susceptible, Infected &amp; Recovered Differential Epidemiological Curves</text>
          
          <line x1="30" y1="120" x2="520" y2="120" stroke="#481c3c" stroke-width="1" />
          
          <!-- Susceptible Curve -->
          <path d="M 40 40 Q 150 50 300 110 T 510 115" fill="none" stroke="#38bdf8" stroke-width="2" />
          <!-- Infected Curve -->
          <path d="M 40 115 Q 180 30 320 100 T 510 118" fill="none" stroke="#ec4899" stroke-width="3" />
          <!-- Recovered Curve -->
          <path d="M 40 118 Q 200 110 320 60 T 510 40" fill="none" stroke="#10b981" stroke-width="2" />

          <text x="170" y="45" fill="#ec4899" font-family="sans-serif" font-size="9" font-weight="700">● Peak Infection Curve (R0: 2.4)</text>
          <text x="360" y="55" fill="#10b981" font-family="sans-serif" font-size="9">● Herd Recovery Trajectory</text>
          <text x="30" y="135" fill="#94a3b8" font-family="sans-serif" font-size="9">Day 0 to Day 365 Timeline</text>
        </g>
        
  </g>
</svg>