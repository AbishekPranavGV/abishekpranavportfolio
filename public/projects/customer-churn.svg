<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_customer-churn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191129" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_customer-churn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_customer-churn" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_customer-churn)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Customer Churn Decision Analysis</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#8b5cf6" />
  <text x="474" y="22" fill="#8b5cf6" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Customer Churn Decision Analysis</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Predictive retention ML treating attrition as an economic problem</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#281a42" stroke="#412c6d" />
          <text x="14" y="24" fill="#8b5cf6" font-family="sans-serif" font-size="18" font-weight="800">88.5%</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">ROC-AUC Score</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#281a42" stroke="#412c6d" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">$2.4M ARR</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Protected Revenue</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#281a42" stroke="#412c6d" />
          <text x="374" y="24" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">Top 5 Drivers</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Root Churn Triggers</text>
        </g>

        <!-- Decision Tree / Risk Matrix -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#1d1230" stroke="#412c6d" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Customer Attrition Risk Distribution &amp; Decision Tree Split</text>
          
          <rect x="25" y="40" width="150" height="85" rx="6" fill="#2c1a47" stroke="#8b5cf6" />
          <text x="35" y="60" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">Monthly Contract</text>
          <text x="35" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="9">Tenure &lt; 6 months</text>
          <text x="35" y="96" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="700">CHURN RISK: 82%</text>

          <line x1="175" y1="82" x2="215" y2="82" stroke="#8b5cf6" stroke-width="2" />

          <rect x="215" y="40" width="150" height="85" rx="6" fill="#2c1a47" stroke="#8b5cf6" />
          <text x="225" y="60" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">Support Tickets &gt; 3</text>
          <text x="225" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="9">Fiber Optic Service</text>
          <text x="225" y="96" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700">DISCOUNT TARGET</text>

          <line x1="365" y1="82" x2="405" y2="82" stroke="#8b5cf6" stroke-width="2" />

          <rect x="405" y="40" width="115" height="85" rx="6" fill="#143628" stroke="#10b981" />
          <text x="415" y="60" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">2-Year Plan</text>
          <text x="415" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="9">Autopay Enabled</text>
          <text x="415" y="96" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">RETENTION: 96%</text>
        </g>
        
  </g>
</svg>