<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nicms-blueprint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192e" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_nicms-blueprint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_nicms-blueprint" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_nicms-blueprint)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">NICMS Sri Lanka Strategic Blueprint</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#0ea5e9" />
  <text x="474" y="22" fill="#0ea5e9" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">NICMS Sri Lanka Strategic Blueprint</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">National public sector digital infrastructure &amp; zero-trust architecture</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#112745" stroke="#1b4578" />
          <text x="14" y="24" fill="#0ea5e9" font-family="sans-serif" font-size="18" font-weight="800">99.99%</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">High-Availability SLA</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#112745" stroke="#1b4578" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">Zero-Trust</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Defense Architecture</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#112745" stroke="#1b4578" />
          <text x="374" y="24" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">28 Ministries</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Inter-Agency Data Bus</text>
        </g>

        <!-- Enterprise Blueprint Diagram -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#0c1f38" stroke="#1b4578" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">National Information &amp; Communication Architecture Layers</text>
          
          <rect x="25" y="38" width="150" height="40" rx="6" fill="#173559" stroke="#0ea5e9" />
          <text x="35" y="55" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Citizen Portal / Apps</text>
          <text x="35" y="68" fill="#94a3b8" font-family="sans-serif" font-size="8">Multi-lingual Web &amp; Mobile</text>

          <rect x="195" y="38" width="150" height="40" rx="6" fill="#173559" stroke="#10b981" />
          <text x="205" y="55" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">API Gateway &amp; ESB</text>
          <text x="205" y="68" fill="#94a3b8" font-family="sans-serif" font-size="8">mTLS 1.3 / OAuth 2.0</text>

          <rect x="365" y="38" width="150" height="40" rx="6" fill="#173559" stroke="#f59e0b" />
          <text x="375" y="55" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700">National Data Repos</text>
          <text x="375" y="68" fill="#94a3b8" font-family="sans-serif" font-size="8">Sovereign Cloud Data</text>

          <rect x="25" y="90" width="490" height="40" rx="6" fill="#0d2442" stroke="#334155" />
          <text x="40" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700">Zero-Trust Infrastructure: Distributed HSMs, Cryptographic Auditing, FIPS 140-3 Compliance</text>
        </g>
        
  </g>
</svg>