<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_streamlit-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260e0e" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_streamlit-app" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_streamlit-app" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_streamlit-app)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Enterprise Streamlit Application Suite</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#ff4b4b" fill-opacity="0.18" stroke="#ff4b4b" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#ff4b4b" />
  <text x="474" y="22" fill="#ff4b4b" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Enterprise Streamlit Application Suite</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Python reactive data app, widget state caching & multi-page layouts</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#3d1818" stroke="#662828" />
          <text x="14" y="24" fill="#ff4b4b" font-family="sans-serif" font-size="18" font-weight="800">&lt;50ms</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Cache Retrieval</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#3d1818" stroke="#662828" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">15+ Widgets</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Reusable BI Templates</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#3d1818" stroke="#662828" />
          <text x="374" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">Multi-Page</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Dynamic Data Router</text>
        </g>

        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#2d1212" stroke="#662828" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Streamlit Interactive Dashboard UI & Reactive Parameters</text>
          
          <rect x="25" y="40" width="490" height="88" rx="6" fill="#170909" stroke="#471c1c" />
          <text x="35" y="58" fill="#ff4b4b" font-family="monospace" font-size="9">st.sidebar.slider("Select Horizon (Weeks)", 1, 52, 12)</text>
          <text x="35" y="74" fill="#cbd5e1" font-family="monospace" font-size="9">@st.cache_data: Loaded 120,000 transaction rows in 12ms</text>
          <text x="35" y="90" fill="#10b981" font-family="monospace" font-size="9">Plotly Render: Multi-axis responsive chart rendered at 60fps</text>
          <text x="35" y="106" fill="#38bdf8" font-family="monospace" font-size="9">Cloud Deploy: Streamlit Cloud containerized & live</text>
        </g>
        
  </g>
</svg>