<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_retail-sales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_retail-sales" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_retail-sales" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_retail-sales)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Retail Predictive Analytics &amp; Inventory Model</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#38bdf8" />
  <text x="474" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Retail Predictive Analytics &amp; Inventory Model</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">SQL window functions, ARIMA &amp; Facebook Prophet demand forecasting</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <!-- KPI Row -->
        <g>
          <rect x="0" y="0" width="125" height="54" rx="8" fill="#122340" stroke="#1d3f72" />
          <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">85%</text>
          <text x="12" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Forecast Accuracy</text>

          <rect x="138" y="0" width="125" height="54" rx="8" fill="#122340" stroke="#1d3f72" />
          <text x="150" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">10 hrs/wk</text>
          <text x="150" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Manual Work Cut</text>

          <rect x="276" y="0" width="125" height="54" rx="8" fill="#122340" stroke="#1d3f72" />
          <text x="288" y="24" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">70% Profit</text>
          <text x="288" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Top 20% SKUs</text>

          <rect x="414" y="0" width="125" height="54" rx="8" fill="#122340" stroke="#1d3f72" />
          <text x="426" y="24" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="800">$1B+</text>
          <text x="426" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Inventory Solved</text>
        </g>

        <!-- Power BI Forecast Graph Replica -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#0d1c33" stroke="#1d3f72" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">7-Day Moving Avg Demand vs Predicted Stock Replenishment</text>
          
          <!-- Chart Axes -->
          <line x1="30" y1="120" x2="520" y2="120" stroke="#334155" stroke-width="1" />
          <line x1="30" y1="35" x2="30" y2="120" stroke="#334155" stroke-width="1" />
          
          <!-- Historical Demand Bars -->
          <rect x="50" y="70" width="14" height="50" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="75" y="60" width="14" height="60" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="100" y="50" width="14" height="70" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="125" y="65" width="14" height="55" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="150" y="45" width="14" height="75" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="175" y="40" width="14" height="80" fill="#38bdf8" opacity="0.7" rx="2" />
          <rect x="200" y="55" width="14" height="65" fill="#38bdf8" opacity="0.7" rx="2" />

          <!-- Forecast Prophet Line -->
          <path d="M 220 70 Q 280 40 340 50 T 420 35 T 510 45" fill="none" stroke="#10b981" stroke-width="3" />
          <!-- Confidence Interval Cloud -->
          <path d="M 220 55 Q 280 25 340 35 T 420 20 T 510 30 L 510 60 Q 420 50 340 65 T 280 55 T 220 85 Z" fill="#10b981" opacity="0.15" />
          
          <text x="360" y="105" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700">● Prophet 95% Confidence Band</text>
          <text x="50" y="135" fill="#64748b" font-family="sans-serif" font-size="9">Wk 1-12 Historical</text>
          <text x="320" y="135" fill="#38bdf8" font-family="sans-serif" font-size="9">Wk 13-24 Forecasted Horizon</text>
        </g>
        
  </g>
</svg>