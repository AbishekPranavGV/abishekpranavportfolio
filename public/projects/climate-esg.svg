<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_climate-esg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b16" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_climate-esg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_climate-esg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_climate-esg)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Climate Impact & ESG Dashboard</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#10b981" />
  <text x="474" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Climate Impact & ESG Dashboard</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Real-time carbon emissions telemetry & CSRD regulatory alignment</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#0d2b23" stroke="#185645" />
          <text x="14" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">-32.4%</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Scope 1 & 2 Emissions</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#0d2b23" stroke="#185645" />
          <text x="194" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">4,280/sec</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Telemetry Ingest Rate</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#0d2b23" stroke="#185645" />
          <text x="374" y="24" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">CSRD / SEC</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Audit-Ready Compliance</text>
        </g>

        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#09211b" stroke="#185645" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Real-Time Facility Carbon Intensity by Emission Scope</text>
          
          <text x="25" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="10">Scope 1 (Direct Fuel): 420 Tonnes CO2e</text>
          <rect x="25" y="62" width="480" height="12" rx="4" fill="#1e3a32" />
          <rect x="25" y="62" width="280" height="12" rx="4" fill="#ef4444" />

          <text x="25" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="10">Scope 2 (Purchased Electricity): 680 Tonnes CO2e</text>
          <rect x="25" y="102" width="480" height="12" rx="4" fill="#1e3a32" />
          <rect x="25" y="102" width="340" height="12" rx="4" fill="#f59e0b" />

          <text x="25" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="10">Solar & Clean Energy Offset: 310 Tonnes CO2e (Negative Delta)</text>
          <rect x="25" y="142" width="480" height="12" rx="4" fill="#1e3a32" />
          <rect x="25" y="142" width="190" height="12" rx="4" fill="#10b981" />
        </g>
        
  </g>
</svg>