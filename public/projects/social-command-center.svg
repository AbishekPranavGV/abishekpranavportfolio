<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_social-command-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151630" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_social-command-center" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_social-command-center" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_social-command-center)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Social Command Center</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#6366f1" />
  <text x="474" y="22" fill="#6366f1" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE ON VERCEL</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Social Command Center</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Next.js 20 multi-network autonomous campaign dispatcher</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <!-- Multi-Platform Channel Bar -->
        <g>
          <rect x="0" y="0" width="125" height="50" rx="8" fill="#1e1f42" stroke="#31336a" />
          <text x="12" y="22" fill="#6366f1" font-family="sans-serif" font-size="12" font-weight="700">LinkedIn</text>
          <text x="12" y="38" fill="#10b981" font-family="monospace" font-size="9">● Published (99.8%)</text>

          <rect x="138" y="0" width="125" height="50" rx="8" fill="#1e1f42" stroke="#31336a" />
          <text x="150" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Twitter / X</text>
          <text x="150" y="38" fill="#10b981" font-family="monospace" font-size="9">● Scheduled (2h)</text>

          <rect x="276" y="0" width="125" height="50" rx="8" fill="#1e1f42" stroke="#31336a" />
          <text x="288" y="22" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="700">Instagram</text>
          <text x="288" y="38" fill="#10b981" font-family="monospace" font-size="9">● Sync Active</text>

          <rect x="414" y="0" width="125" height="50" rx="8" fill="#1e1f42" stroke="#31336a" />
          <text x="426" y="22" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">Analytics</text>
          <text x="426" y="38" fill="#cbd5e1" font-family="monospace" font-size="9">+34.2% Growth</text>
        </g>

        <!-- Dispatch Queue Simulator -->
        <g transform="translate(0, 65)">
          <rect width="540" height="152" rx="8" fill="#131428" stroke="#31336a" />
          <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Autonomous Content Stream Telemetry</text>
          
          <!-- Post 1 -->
          <rect x="16" y="38" width="508" height="30" rx="6" fill="#1e1f42" />
          <text x="28" y="57" fill="#6366f1" font-family="sans-serif" font-size="10" font-weight="700">[LINKEDIN]</text>
          <text x="100" y="57" fill="#e2e8f0" font-family="sans-serif" font-size="10">Autonomous B2B AI Workflow Case Study #04</text>
          <text x="440" y="57" fill="#10b981" font-family="monospace" font-size="10">2,480 views</text>

          <!-- Post 2 -->
          <rect x="16" y="74" width="508" height="30" rx="6" fill="#1e1f42" />
          <text x="28" y="93" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">[TWITTER]</text>
          <text x="100" y="93" fill="#e2e8f0" font-family="sans-serif" font-size="10">Thread: How SQL CTEs + Prophet Reduced Stockouts by 85%</text>
          <text x="440" y="93" fill="#10b981" font-family="monospace" font-size="10">142 retweets</text>

          <!-- Post 3 -->
          <rect x="16" y="110" width="508" height="30" rx="6" fill="#1e1f42" />
          <text x="28" y="129" fill="#ec4899" font-family="sans-serif" font-size="10" font-weight="700">[INSTAGRAM]</text>
          <text x="100" y="129" fill="#e2e8f0" font-family="sans-serif" font-size="10">Reel: Real-Time ESG Emissions Analytics Pipeline</text>
          <text x="440" y="129" fill="#10b981" font-family="monospace" font-size="10">894 likes</text>
        </g>
        
  </g>
</svg>