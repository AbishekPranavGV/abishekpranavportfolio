<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_facedetection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081d1c" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_facedetection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_facedetection" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_facedetection)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Real-Time Face Detection & Classifier</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#14b8a6" fill-opacity="0.18" stroke="#14b8a6" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#14b8a6" />
  <text x="474" y="22" fill="#14b8a6" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Real-Time Face Detection & Classifier</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">OpenCV Haar Cascades for multi-landmark facial tracking</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#0f302e" stroke="#1d5c58" />
          <text x="14" y="24" fill="#14b8a6" font-family="sans-serif" font-size="18" font-weight="800">30+ FPS</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Real-Time Inference</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#0f302e" stroke="#1d5c58" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">96.4%</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Detection Precision</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#0f302e" stroke="#1d5c58" />
          <text x="374" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">4 Cascades</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Face, Eye, Nose, Mouth</text>
        </g>

        <!-- OpenCV Canvas View -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#0a2422" stroke="#1d5c58" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">OpenCV Camera Viewfinder & Facial Coordinate Tracking</text>
          
          <rect x="190" y="35" width="160" height="95" rx="4" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
          <text x="195" y="50" fill="#10b981" font-family="monospace" font-size="9">FACE: 97.8%</text>

          <!-- Eyes -->
          <circle cx="230" cy="70" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
          <circle cx="230" cy="70" r="2" fill="#38bdf8" />
          <circle cx="310" cy="70" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
          <circle cx="310" cy="70" r="2" fill="#38bdf8" />

          <!-- Nose & Mouth -->
          <line x1="270" y1="78" x2="270" y2="92" stroke="#f59e0b" stroke-width="2" />
          <path d="M 245 108 Q 270 120 295 108" fill="none" stroke="#14b8a6" stroke-width="2" />

          <text x="20" y="135" fill="#94a3b8" font-family="monospace" font-size="9">ScaleFactor: 1.1 · MinNeighbors: 5 · CPU Latency: 16ms</text>
        </g>
        
  </g>
</svg>