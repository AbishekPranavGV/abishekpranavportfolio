<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_stock-prediction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081d18" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_stock-prediction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_stock-prediction" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_stock-prediction)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Quantitative Stock Price Prediction Engine</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#10b981" />
  <text x="474" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Quantitative Stock Price Prediction Engine</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Econometric ARIMA &amp; Deep LSTM neural network volatility hybrid</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#0e2e26" stroke="#164e3f" />
          <text x="14" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">0.018 RMSE</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Normalized Test Loss</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#0e2e26" stroke="#164e3f" />
          <text x="194" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">Ensemble Fit</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">ARIMA (2,1,2) + LSTM</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#0e2e26" stroke="#164e3f" />
          <text x="374" y="24" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">74.2% Direction</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Hit Ratio on Walk-Forward</text>
        </g>

        <!-- Candlestick &amp; Prediction Line -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#0a241e" stroke="#164e3f" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Daily OHLC Volatility &amp; LSTM Deep Recurrent Forecast</text>
          
          <line x1="30" y1="120" x2="520" y2="120" stroke="#1f4f41" stroke-width="1" />
          
          <!-- Candlesticks -->
          <line x1="50" y1="50" x2="50" y2="110" stroke="#10b981" />
          <rect x="46" y="60" width="8" height="35" fill="#10b981" />

          <line x1="80" y1="40" x2="80" y2="105" stroke="#ef4444" />
          <rect x="76" y="55" width="8" height="40" fill="#ef4444" />

          <line x1="110" y1="55" x2="110" y2="115" stroke="#10b981" />
          <rect x="106" y="65" width="8" height="30" fill="#10b981" />

          <line x1="140" y1="45" x2="140" y2="95" stroke="#10b981" />
          <rect x="136" y="50" width="8" height="35" fill="#10b981" />

          <line x1="170" y1="35" x2="170" y2="85" stroke="#10b981" />
          <rect x="166" y="40" width="8" height="30" fill="#10b981" />

          <!-- LSTM Forecast Curve -->
          <path d="M 180 50 Q 260 70 340 40 T 440 30 T 510 20" fill="none" stroke="#38bdf8" stroke-width="2.5" />
          <circle cx="510" cy="20" r="4" fill="#38bdf8" />
          
          <text x="320" y="105" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700">● LSTM Projected Price Trajectory</text>
          <text x="30" y="135" fill="#94a3b8" font-family="sans-serif" font-size="9">Historical Price Series</text>
          <text x="420" y="135" fill="#10b981" font-family="sans-serif" font-size="9">Keras .h5 Inference</text>
        </g>
        
  </g>
</svg>