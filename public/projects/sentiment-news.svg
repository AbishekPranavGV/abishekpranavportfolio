<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sentiment-news" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191608" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="acc_sentiment-news" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow_sentiment-news" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="590" height="340" fill="url(#bg_sentiment-news)" rx="14" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="590" y2="50" />
    <line x1="0" y1="110" x2="590" y2="110" />
    <line x1="0" y1="170" x2="590" y2="170" />
    <line x1="0" y1="230" x2="590" y2="230" />
    <line x1="0" y1="290" x2="590" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Title Window Bar -->
  <rect x="0" y="0" width="590" height="38" fill="#111827" opacity="0.9" rx="14" />
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="68" y="23" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">News Headline Sentiment &amp; Polarity Classifier</text>
  
  <!-- Status Badge -->
  <rect x="455" y="10" width="120" height="18" rx="9" fill="#eab308" fill-opacity="0.18" stroke="#eab308" stroke-width="1" />
  <circle cx="466" cy="19" r="2.5" fill="#eab308" />
  <text x="474" y="22" fill="#eab308" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">LIVE GITHUB PAGES</text>

  <!-- Subtitle -->
  <text x="24" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">News Headline Sentiment &amp; Polarity Classifier</text>
  <text x="24" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">VADER &amp; Transformer NLP text mining analyzing financial markets</text>

  <!-- Visual Canvas -->
  <g transform="translate(24, 90)">
    
        <g>
          <rect x="0" y="0" width="165" height="54" rx="8" fill="#2b260e" stroke="#4d4419" />
          <text x="14" y="24" fill="#eab308" font-family="sans-serif" font-size="18" font-weight="800">250,000+</text>
          <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Headlines Scored</text>

          <rect x="180" y="0" width="165" height="54" rx="8" fill="#2b260e" stroke="#4d4419" />
          <text x="194" y="24" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">89.1%</text>
          <text x="194" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Sentiment F1-Score</text>

          <rect x="360" y="0" width="180" height="54" rx="8" fill="#2b260e" stroke="#4d4419" />
          <text x="374" y="24" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">VADER + BERT</text>
          <text x="374" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Dual Polarity Pipeline</text>
        </g>

        <!-- Sentiment Polarity Meter -->
        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#211d0a" stroke="#4d4419" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Financial Sentiment Index: Bullish (+0.68) vs Bearish (-0.32)</text>
          
          <rect x="25" y="45" width="490" height="24" rx="6" fill="#141207" stroke="#334155" />
          <rect x="25" y="45" width="120" height="24" rx="6" fill="#ef4444" />
          <rect x="145" y="45" width="110" height="24" fill="#64748b" />
          <rect x="255" y="45" width="260" height="24" rx="6" fill="#10b981" />
          
          <text x="45" y="61" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">BEARISH (24%)</text>
          <text x="165" y="61" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">NEUTRAL (22%)</text>
          <text x="340" y="61" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">BULLISH (54%)</text>

          <text x="25" y="100" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Sample Headline:</text>
          <text x="25" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10">"Federal Reserve signals rate easing in Q4 as manufacturing output rises 3.8%"</text>
          <text x="25" y="136" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">Classification: POSITIVE / HIGH CONVICTION (+0.78)</text>
        </g>
        
  </g>
</svg>